services:
  - type: web
    name: quanly-vanban-congviec
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: quanly-vanbancongviec-db
          property: connectionString
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        sync: false
      - key: REMINDER_SECRET
        generateValue: true

  - type: cron
    name: quanly-vanban-reminders
    runtime: docker
    plan: starter
    schedule: "* * * * *"
    dockerCommand: python reminder_worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quanly-vanbancongviec-db
          property: connectionString
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        sync: false

databases:
  - name: quanly-vanbancongviec-db
    plan: free
